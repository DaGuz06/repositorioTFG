<section class="reviews-section">
  <h2>Reseñas de Comensales</h2>
  <div *ngIf="reviews.length > 0; else noReviews" class="reviews-grid">
    <div class="review-card" *ngFor="let review of reviews">
      <div class="review-header">
        <img [src]="review.profile_picture ? (review.profile_picture | imageUrl) : '/profileIcon.svg'" alt="User"
          class="avatar" onerror="this.src='/profileIcon.svg'">
        <div class="review-header-info">
          <h3>{{ review.user_name || ('Usuario #' + review.user_id) }}</h3>
          <span class="review-date" *ngIf="review.created_at">{{ review.created_at | date:'d MMM yyyy' }}</span>
        </div>
      </div>
      <div class="review-rating">
        <span *ngFor="let star of [1,2,3,4,5]" class="star" [class.filled]="star <= review.rating">★</span>
      </div>
      <p class="review-comment">"{{ review.text }}"</p>
    </div>
  </div>
  <ng-template #noReviews>
    <p class="no-reviews">Aún no hay reseñas para este chef.</p>
  </ng-template>
</section>
