<div class="chef-rating-container">
    <h3>Valora tu experiencia</h3>
    <div class="stars-container">
        <span *ngFor="let star of [1, 2, 3, 4, 5]" class="star" [class.active]="star <= (hoverRating || rating)"
            (click)="setRating(star)" (mouseenter)="onHover(star)" (mouseleave)="onHover(0)">
            ★
        </span>
    </div>

    <div class="comment-section">
        <label for="comment">Cuéntanos más (opcional):</label>
        <textarea id="comment" [(ngModel)]="comment" placeholder="Tu opinión nos ayuda a mejorar..."></textarea>
    </div>

    <button class="submit-btn" (click)="submitRating()">
        Enviar Valoración
    </button>
</div>
